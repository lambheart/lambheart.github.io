<header class="site-header">
  <div class="header-content">
    <a href="{{ "/" | relLangURL }}" class="site-name">{{ .Site.Title }}</a>
    <div class="lang-switcher">
      {{ range .Translations }}
        <a href="{{ .RelPermalink }}" lang="{{ .Language.LanguageCode }}" hreflang="{{ .Language.LanguageCode }}" class="lang-btn">{{ .Language.LanguageName }}</a>
      {{ else }}
        {{ range .Site.Sites }}
          {{ if ne .Language.Lang $.Language.Lang }}
            <a href="{{ .Home.RelPermalink }}" lang="{{ .Language.LanguageCode }}" hreflang="{{ .Language.LanguageCode }}" aria-label="{{ if eq .Language.Lang "zh" }}中文首页{{ else }}English home{{ end }}" class="lang-btn">{{ .Language.LanguageName }}</a>
          {{ end }}
        {{ end }}
      {{ end }}
    </div>
  </div>
</header>
